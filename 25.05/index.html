<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задания 4 и 5</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin-bottom: 50px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        
        /* Стили для прогресс-бара */
        #progress-container { width: 100%; max-width: 400px; background-color: #e0e0e0; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        #progress-bar { width: 0%; height: 30px; background-color: #4caf50; transition: width 0.3s; }
        
        /* Стили для игры */
        #game-btn { padding: 15px 30px; font-size: 18px; cursor: pointer; }
        #game-btn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Задание 4: Прогресс-бар -->
    <div class="section">
        <h2>Задание 4: Прогресс-бар</h2>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-status">Ожидание...</div>
        <button onclick="startProgress()" id="start-prog-btn">Запустить задачу</button>
    </div>

    <!-- Задание 5: Игра на реакцию -->
    <div class="section">
        <h2>Задание 5: Игра на реакцию (Бонус)</h2>
        <p id="game-message">Нажмите "Старт", чтобы начать игру.</p>
        <button id="game-btn" disabled>Нажми меня</button>
        <br><br>
        <button onclick="startReactionGame()" id="start-game-btn">Старт / Рестарт</button>
    </div>

    <script>
        // Логика Задания 4: Прогресс-бар
        function delayForProgress(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function startProgress() {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('progress-status');
            const btn = document.getElementById('start-prog-btn');
            
            btn.disabled = true; // Блокируем кнопку на время выполнения
            progressBar.style.width = '0%';
            let width = 0;

            statusText.innerText = "Выполнение...";

            for (let i = 0; i < 5; i++) {
                await delayForProgress(1000);
                width += 20;
                progressBar.style.width = width + '%';
            }

            statusText.innerText = "Готово!";
            btn.disabled = false;
        }


        // Логика Задания 5: Игра с таймерами
        let gameTimeout;

        function startReactionGame() {
            const msg = document.getElementById('game-message');
            const btn = document.getElementById('game-btn');
            
            clearTimeout(gameTimeout);
            btn.disabled = true;
            btn.onclick = null;
            msg.innerText = "Приготовьтесь... Кнопка станет активной от 1 до 5 секунд.";

            const randomDelay = Math.floor(Math.random() * 4000) + 1000;

            gameTimeout = setTimeout(() => {
                msg.innerText = "НАЖИМАЙТЕ!";
                btn.disabled = false;
                
                const startTime = performance.now();

                btn.onclick = () => {
                    const endTime = performance.now();
                    const reactionTime = Math.round(endTime - startTime);
                    
                    msg.innerText = `Ваш результат: ${reactionTime} миллисекунд!`;
                    btn.disabled = true;
                };
            }, randomDelay);
        }
    </script>
</body>
</html>
